<!doctype html>
<html>
  <head>
    <title>Dashboard Penjual</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      .grid {
        display: flex;
        gap: 20px;
      }
      .form-sec {
        width: 30%;
      }
      .list-sec {
        width: 70%;
      }
      input,
      textarea {
        width: 100%;
        margin-bottom: 10px;
        padding: 5px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1>Dashboard Pemilik Warung</h1>
    <div class="grid">
      <div class="form-sec">
        <h3>Tambah Produk</h3>
        <form method="POST" enctype="multipart/form-data">
          <input
            type="text"
            name="warung_name"
            placeholder="Nama Warung"
            required
          />
          <input
            type="text"
            name="prod_name"
            placeholder="Nama Produk"
            required
          />
          <textarea
            name="desc"
            placeholder="Deskripsi Produk"
            required
          ></textarea>
          <input type="number" name="stock" placeholder="Stok" required />
          <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Harga"
            required
          />
          <input
            type="file"
            name="image"
            accept="image/jpeg,image/png,image/webp"
            required
          />
          <p>Pembayaran: Bank Transfer & COD Tersedia</p>
          <button type="submit">Simpan Produk</button>
        </form>
      </div>
      <div class="list-sec">
        <h3>Produk Saya</h3>
        <table>
          <tr>
            <th>Nama</th>
            <th>Stok</th>
            <th>Harga</th>
            <th>Aksi</th>
          </tr>
          {% for p in products %}
          <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.stock }}</td>
            <td>Rp {{ p.price }}</td>
            <td>
              <a href="/product/edit/{{ p.id }}">Edit</a>
              <form
                method="POST"
                action="/product/delete/{{ p.id }}"
                style="display: inline"
                onsubmit="return confirm('Yakin ingin menghapus produk ini?');"
              >
                <button
                  type="submit"
                  style="
                    color: red;
                    background: none;
                    border: none;
                    cursor: pointer;
                    text-decoration: underline;
                  "
                >
                  Hapus
                </button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </div>
    <a href="/logout">Logout</a>
  </body>
</html>
