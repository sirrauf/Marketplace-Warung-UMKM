<!doctype html>
<html>
  <head>
    <title>Edit Produk</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: auto;
      }
      input,
      textarea {
        width: 100%;
        margin-bottom: 10px;
        padding: 5px;
      }
      .current-img {
        max-width: 150px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Edit Produk</h1>
    {% with messages = get_flashed_messages() %} {% if messages %}
    <ul>
      {% for msg in messages %}
      <li>{{ msg }}</li>
      {% endfor %}
    </ul>
    {% endif %} {% endwith %}
    <form method="POST" enctype="multipart/form-data">
      <label>Nama Warung</label>
      <input
        type="text"
        name="warung_name"
        value="{{ product.warung_name }}"
        required
      />
      <label>Nama Produk</label>
      <input type="text" name="prod_name" value="{{ product.name }}" required />
      <label>Deskripsi</label>
      <textarea name="desc" required>{{ product.description }}</textarea>
      <label>Stok</label>
      <input type="number" name="stock" value="{{ product.stock }}" required />
      <label>Harga</label>
      <input
        type="number"
        step="0.01"
        name="price"
        value="{{ product.price }}"
        required
      />
      <label>Gambar Produk (kosongkan jika tidak ingin mengganti)</label>
      {% if product.image_path %}
      <p>Gambar saat ini:</p>
      <img
        class="current-img"
        src="/static/uploads/{{ product.image_path }}"
        alt="Gambar Produk"
      />
      {% endif %}
      <input
        type="file"
        name="image"
        accept="image/jpeg,image/png,image/webp"
      />
      <br />
      <button type="submit">Simpan Perubahan</button>
      <a href="/dashboard/seller">Batal</a>
    </form>
  </body>
</html>
