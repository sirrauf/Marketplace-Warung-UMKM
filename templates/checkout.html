<!doctype html>
<html>
  <head>
    <title>Checkout</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      form {
        max-width: 500px;
        margin: auto;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">Checkout Pembelian</h2>
    <form method="POST">
      <input
        type="text"
        name="address"
        placeholder="Alamat Pengiriman Lengkap"
        required
      />
      <label>Metode Pembayaran:</label>
      <select name="payment">
        <option>Bank Transfer</option>
        <option>COD</option>
      </select>
      <label>Kurir Pengiriman:</label>
      <select name="courier">
        <option>Reguler (3 Hari)</option>
        <option>Express (1 Hari)</option>
      </select>
      <h3>Total Produk: {{ cart|length }} item</h3>
      <button type="submit">Bayar Sekarang</button>
    </form>
  </body>
</html>
